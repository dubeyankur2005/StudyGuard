<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>StudyGuard</title>

    <link
        rel="stylesheet"
        href="popup.css">

</head>

<body>

    <div class="container">

        <!-- ==========================
             Header
        =========================== -->

        <div class="header">

            <h1>StudyGuard</h1>

            <p class="subtitle">

                Stay Focused While Learning 🚀

            </p>

        </div>

        <!-- ==========================
             Settings Card
        =========================== -->

        <div class="card">

            <div id="authPanel" class="auth-panel">
                <div class="auth-heading">
                    <span class="auth-mark" aria-hidden="true">SG</span>
                    <div><h2>Welcome back</h2><p>Sign in to sync your focus settings.</p></div>
                </div>
                <form id="loginForm" class="auth-form">
                    <label for="loginEmail">Email address</label>
                    <input id="loginEmail" type="email" placeholder="you@example.com" autocomplete="username" required>
                    <label for="loginPassword">Password</label>
                    <input id="loginPassword" type="password" placeholder="Your password" autocomplete="current-password" required>
                    <button id="loginBtn" class="auth-submit" type="submit"><span>Sign in</span><span aria-hidden="true">&gt;</span></button>
                </form>
                <p id="authStatus" class="auth-status" role="status" aria-live="polite"></p>
            </div>

            <div id="accountPanel" hidden>
                <div class="account-summary"><span class="account-avatar" aria-hidden="true">OK</span><p>Signed in as<strong id="accountEmail"></strong></p></div>
                <button id="logoutBtn" class="signout-btn" type="button">Sign out</button>
            </div>
            <p id="settingsStatus" class="settings-status" role="status" aria-live="polite"></p>

            <!-- Study Mode -->

            <div class="setting">

                <div class="setting-left">

                    <div class="icon-circle study-icon">

                        📚

                    </div>

                    <div class="setting-content">

                        <h3>

                            Study Mode

                        </h3>

                        <p>

                            Block distracting content

                        </p>

                    </div>

                </div>

                <label class="switch">

                    <input
                        type="checkbox"
                        id="studyMode">

                    <span class="slider"></span>

                </label>

            </div>

            <div class="divider"></div>

            <!-- Tracking -->

            <div class="setting">

                <div class="setting-left">

                    <div class="icon-circle tracking-icon">

                        🎯

                    </div>

                    <div class="setting-content">

                        <h3>

                            Tracking

                        </h3>

                        <p>

                            Track your watch time

                        </p>

                    </div>

                </div>

                <label class="switch">

                    <input
                        type="checkbox"
                        id="trackingEnabled"
                        checked>

                    <span class="slider"></span>

                </label>

            </div>

        </div>

        <!-- ==========================
             Stats
        =========================== -->

        <div class="stats">

            <!-- Study -->

            <div class="stat-box study-card">

                <div class="stat-icon">

                    📖

                </div>

                <h3 id="todayStudyTime">

                    0 min

                </h3>

                

                <div class="wave"></div>

            </div>

            <!-- Entertainment -->

            <div class="stat-box entertainment-card">

                <div class="stat-icon">

                    🍿

                </div>

                <h3 id="todayEntertainmentTime">

                    0 min

                </h3>

                

                <div class="wave"></div>

            </div>

        </div>

        <!-- ==========================
             Buttons
        =========================== -->

        <button id="dashboardBtn">

            📊 Open Dashboard

        </button>

        <button id="settingsBtn">

            ⚙ Settings

        </button>

        <!-- ==========================
             Footer
        =========================== -->

        <div class="footer">

            💜 Stay Consistent • Keep Learning • Achieve More

        </div>

    </div>

    <script src="popup.js"></script>

</body>

</html>
